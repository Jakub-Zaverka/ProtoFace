<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>title</title>
    <script>
        url = self.location.origin
        function send_checkboxes(){   
            console.log("here")
            matrix = []
                    for (let y = 0; y < 32; y++){
                        for (let x = 0; x < 64; x++){
                            checkbox = document.getElementById(`cbx_${x}x${y}`).checked
                            // console.log(checkbox)

                            if (checkbox == true){
                                console.log((x,y))
                                matrix.push({"x":x,"y":y, "status":1})
                            }
                            else{
                                console.log((x,y))
                                matrix.push({"x":x,"y":y, "status":0})
                            }
                            
                        }
                    }
                    console.log(matrix)
                    return fetch(url + "/conway", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(matrix)
                    })
                }
    </script>
</head>
<body>
    <input id="input1">
    <button onclick="send_checkboxes()">Send</button>
    <table>
        <tbody>
            <!-- Generováno pomocí JavaScriptu -->
        </tbody>
    </table>

    <script>
        const tbody = document.querySelector("table tbody");
        for (let y = 0; y < 32; y++) {
            const row = document.createElement("tr");
            for (let x = 0; x < 64; x++) {
                const cell = document.createElement("td");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.id = `cbx_${x}x${y}`;
                cell.appendChild(checkbox);
                row.appendChild(cell);
            }
            tbody.appendChild(row);
        }
    </script>
</body>

</html>
