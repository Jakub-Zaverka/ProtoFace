<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>title</title>
    <script>
        url = self.location.origin
        //alert(url)
        // curl -X POST -H "Content-Type: application/json" -d 'test' http://192.168.0.126:5000/api
        function postData(data, headers = {}) {

            return fetch(url + "/api", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: document.getElementById("input1").value,
            })
        }
        function changeColorPost(data) {
            body = JSON.stringify({
                r: document.getElementById("inputR").value,
                g: document.getElementById("inputG").value,
                b: document.getElementById("inputB").value,
                brightness: document.getElementById("inputBr").value
            });
            console.log(body)
            return fetch(url + "/api/change_color", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: body
            })
        }
        function send_checkboxes(){
            matrix = []
            for (let y = 0; y < 32; y++){
                for (let x = 0; x < 64; x++){
                    checkbox = document.getElementById(`cbx_${x}x${y}`).checked
                    // console.log(checkbox)

                    if (checkbox == true){
                        console.log((x,y))
                        matrix.push({"x":x,"y":y, "status":1})
                    }
                    else{
                        console.log((x,y))
                        matrix.push({"x":x,"y":y, "status":0})
                    }
                    
                }
            }
            // console.log(matrix)
            return fetch(url + "/api/checkboxes", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(matrix)
            })
        }
    </script>
</head>

<body>
    <input id="input1">
    <button onclick="postData('Test')">Test</button>
    <br>
    <input id="inputR" value="1">
    <input id="inputG" value="2">
    <input id="inputB" value="3">
    <input id="inputBr" value="4">
    <br>
    <button onclick="changeColorPost()">Change</button>

    <table>
        <tbody>
            <!-- Generováno pomocí JavaScriptu -->
        </tbody>
    </table>

    <script>
        const tbody = document.querySelector("table tbody");
        for (let y = 0; y < 32; y++) {
            const row = document.createElement("tr");
            for (let x = 0; x < 64; x++) {
                const cell = document.createElement("td");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.id = `cbx_${x}x${y}`;
                checkbox.onchange = send_checkboxes;
                cell.appendChild(checkbox);
                row.appendChild(cell);
            }
            tbody.appendChild(row);
        }
    </script>
</body>

</html>
